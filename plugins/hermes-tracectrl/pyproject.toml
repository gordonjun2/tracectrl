[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-tracectrl"
version = "0.1.0"
description = "TraceCtrl security observability plugin for Hermes Agent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "tracectrl>=0.3.0,<1",
    "opentelemetry-api>=1.20.0,<2",
    "opentelemetry-sdk>=1.20.0,<2",
]

[project.optional-dependencies]
http = [
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2",
]
grpc = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0,<2",
]
all = [
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0,<2",
]
dev = [
    "pytest>=7.0",
    "pytest-mock",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_tracectrl"]
